<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube → MP3</title>
    <link rel="stylesheet" href="/assets/css/tailwind.css" />
</head>

<body class="min-h-screen bg-gray-50">
    <header class="border-b bg-white">
        <div class="max-w-3xl mx-auto px-4 py-4">
            <h1 class="text-xl font-semibold">YouTube → MP3</h1>
            <p class="text-sm text-gray-600">Dán link YouTube để tải về định dạng MP3</p>
        </div>
    </header>

    <main class="px-4 py-8">
        <div class="grid grid-cols-1 gap-4">
            <div class="col-span-1">

                <form id="convertForm" class="space-y-4">
                    <div>
                        <label for="urls" class="block text-sm font-medium text-gray-700">Danh sách link (mỗi dòng một
                            link
                            YouTube)</label>
                        <textarea id="urls" name="urls" rows="4"
                            placeholder="https://www.youtube.com/watch?v=...\nhttps://youtu.be/..."
                            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label for="folderSelect" class="block text-sm font-medium text-gray-700">Chọn folder có
                                sẵn</label>
                            <select id="folderSelect" name="folderSelect"
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">(Chọn folder)</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label for="folderName" class="block text-sm font-medium text-gray-700">Tên folder lưu
                                file</label>
                            <input id="folderName" name="folderName" type="text" placeholder="ví dụ: tien-nghich"
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                    </div>

                    <div>
                        <label for="bitrate" class="block text-sm font-medium text-gray-700">Bitrate (kbps)</label>
                        <select id="bitrate" name="bitrate"
                            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="128">128</option>
                            <option value="192">192</option>
                            <option value="256">256</option>
                            <option value="320">320</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-3">
                        <button type="button" id="saveMultiBtn" class="btn btn-blue group">
                            <span>Tải files</span>
                        </button>
                        <span id="status" class="text-sm text-gray-600"></span>
                    </div>
                </form>

                <section id="result" class="mt-6 hidden">
                    <div class="p-4 rounded-md border bg-white space-y-3">
                        <div class="w-full h-2 bg-gray-200 rounded">
                            <div id="progressBar" class="h-2 bg-indigo-600 rounded" style="width:0%"></div>
                        </div>
                        <div class="text-sm text-gray-700" id="progressText"></div>
                        <div class="text-sm text-gray-700">Kết quả: <a id="fileLink" href="#"
                                class="text-indigo-600 hover:underline"></a></div>
                    </div>
                </section>

                <section id="multiResult" class="mt-6 hidden">
                    <div class="p-4 rounded-md border bg-white">
                        <div id="multiList" class="space-y-3"></div>
                    </div>
                </section>
            </div>
        </div>




    </main>

    <script src="/app.js"></script>
</body>

</html>
